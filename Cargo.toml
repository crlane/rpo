[package]
name = "rpo-bindings"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Python bindings for the rpo git-analysis library"
license = "MIT"
publish = false

[lib]
name = "_rpo"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-polars = "0.28"
polars = { version = "0.55", features = ["lazy", "dtype-datetime", "dtype-categorical"] }
rpo = "0.1.0-beta.3"
