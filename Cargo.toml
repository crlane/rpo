[package]
name = "rpo-bindings"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Python bindings for the rpo git-analysis library"
license = "MIT"
publish = false

[lib]
name = "_rpo"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-polars = "0.28"
polars = { version = "0.55", features = ["lazy", "dtype-datetime", "dtype-categorical"] }
# TEMPORARY: path dep instead of `rpo = "0.1.0-beta.2"`.
# All versions of `bisync` were yanked upstream on 2026-08-24; it is a
# non-optional dependency of gix-protocol, which gix pulls in
# unconditionally, so a fresh resolve of the published crate fails.
# gitoxide has an open issue. Switch back to the crates.io version once
# that lands — the binding code is identical either way.
rpo = { path = "../rpo-rust/rpo" }
