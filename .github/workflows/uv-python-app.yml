name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: continuous-integration
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # The package is a compiled extension; there is nothing to import
      # until it is built.
      - name: Build the Rust extension
        run: uv run maturin develop --release

      - name: Run tests
        timeout-minutes: 10
        run: uv run py.test -m 'not integration'

      - name: Lint with Ruff
        run: uv tool run ruff check -q

      - name: Check format with Ruff
        run: uv tool run ruff format --check -q

  # The extension must load on every platform we publish wheels for.
  # Running the whole suite everywhere is not worth the minutes; a real
  # analysis against this checkout is enough to catch a broken build.
  import-check:
    name: import on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      # A shallow clone has no history to analyze, and this job asserts
      # the extension produces real results.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # `uv tool run` keeps maturin out of the project environment. Syncing
      # the project here would pull altair[all] -> vegafusion -> arro3-core,
      # which ships no sdist and has no wheel for some runner/python
      # combinations. This job only needs to prove the extension loads.
      - name: Build a wheel
        run: uv tool run --from 'maturin>=1.7,<2' maturin build --release --out dist

      - name: Install the wheel and analyze this repository
        shell: bash
        run: |
          uv venv --python 3.13 .venv-wheel
          uv pip install --python .venv-wheel --find-links dist --no-deps rpo
          uv pip install --python .venv-wheel polars
          uv run --no-project --python .venv-wheel python -c "
          import rpo
          analysis = rpo.analyze('.')
          assert analysis.commits.height > 0, 'no commits found'
          assert analysis.file_changes.height > 0, 'no file changes found'
          print('ok:', rpo.__version__, analysis)
          "
